<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Sabka Delivery — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fffaf0;color:#211713;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.card{width:min(420px,100%);background:#fff;border:1px solid #f0ddd0;border-radius:24px;padding:28px;text-align:center;box-shadow:0 18px 60px rgba(64,24,8,.12)}img{width:112px;height:112px;border-radius:24px;object-fit:cover}h1{font-size:26px;margin:18px 0 8px}p{color:#6c5a51;line-height:1.55;margin:0 0 20px}button{border:0;border-radius:14px;background:#d71920;color:#fff;font-weight:800;font-size:16px;padding:14px 22px;width:100%}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/images/sabka-delivery-logo.png" alt="Sabka Delivery" />
      <h1>You are offline</h1>
      <p>Internet connection check karke dobara try karein. Your saved orders remain safe.</p>
      <button type="button" onclick="location.reload()">Try again</button>
